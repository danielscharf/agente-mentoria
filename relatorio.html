<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Evoluabilidade™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;600;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
/* ── GL-041 Design Tokens ─────────────────────────────────────── */
:root {
  --purple:       #2D2A5E;
  --purple-deep:  #1E1B47;
  --purple-soft:  #4A4787;
  --purple-tint:  #E3E2EF;
  --off-white:    #FAF9F6;
  --paper:        #FFFFFF;
  --bone:         #F1EEE7;
  --hairline:     #E5E2DA;
  --hairline-s:   #C9C4B6;
  --ink:          #15132F;
  --ink-2:        #3D3A5C;
  --ink-3:        #6E6A85;
  --ink-4:        #A09DB1;
  --orange:       #E8734A;
  --orange-deep:  #C25530;
  --orange-soft:  #FAD7C6;
  --cream:        #F4EDE0;
  --success:      #1F8A5B;
  --warn:         #B58B2C;
  --danger:       #C2412A;
  --font-serif:   'Instrument Serif', Georgia, serif;
  --font-ui:      'Inter Tight', sans-serif;
  --font-body:    'Inter', sans-serif;
}

/* ── Base ─────────────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body {
  background: #E8E6E0;
  font-family: var(--font-body);
  font-size: 11pt;
  color: var(--ink);
  line-height: 1.5;
}

/* ── Page wrapper ─────────────────────────────────────────────── */
.report-wrap {
  max-width: 794px; /* A4 width at 96dpi */
  margin: 24px auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.page {
  background: var(--off-white);
  width: 100%;
  min-height: 1123px; /* A4 height at 96dpi */
  padding: 60px 52px 48px 60px;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Print ────────────────────────────────────────────────────── */
@media print {
  body { background: var(--off-white); margin: 0; }
  .report-wrap { max-width: 100%; margin: 0; gap: 0; }
  .no-print { display: none !important; }
  .page {
    min-height: 0;
    height: 100vh;
    padding: 0;
    page-break-before: always;
    page-break-after: always;
    break-before: page;
  }
  .page:first-child { page-break-before: avoid; }
  canvas { max-width: 100% !important; }
}
@page {
  size: A4 portrait;
  margin: 2.5cm 2.0cm 2.0cm 2.5cm;
}
@media print {
  .page { padding: 0; height: auto; min-height: 0; }
}

/* ── Loading ──────────────────────────────────────────────────── */
#loading {
  position: fixed; inset: 0;
  background: var(--off-white);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 999;
  gap: 16px;
}
#loading .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--orange);
  display: inline-block;
  animation: pulse 1.4s infinite;
}
#loading .dot:nth-child(2) { animation-delay: 0.2s; }
#loading .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }
#loading p { font-family: var(--font-ui); font-size: 13px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }

/* ── Toolbar ──────────────────────────────────────────────────── */
.toolbar {
  position: fixed; top: 16px; right: 16px;
  display: flex; gap: 8px;
  z-index: 100;
}
.btn {
  font-family: var(--font-ui); font-weight: 700; font-size: 11px;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 8px 16px; border-radius: 999px; border: none; cursor: pointer;
  transition: all 120ms;
}
.btn-primary { background: var(--orange); color: white; }
.btn-primary:hover { background: var(--orange-deep); }
.btn-secondary { background: white; color: var(--purple); border: 1.5px solid var(--purple-tint); }
.btn-secondary:hover { background: var(--purple-tint); }

/* ── Typography helpers ───────────────────────────────────────── */
.eyebrow {
  font-family: var(--font-ui); font-weight: 600; font-size: 9pt;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3);
}
.eyebrow.orange { color: var(--orange); }
.eyebrow.purple { color: var(--purple); }
.display {
  font-family: var(--font-serif); font-style: italic;
  font-size: 52pt; line-height: 0.92;
  color: var(--ink); letter-spacing: -0.02em;
}
.t-h1 {
  font-family: var(--font-ui); font-weight: 700; font-size: 22pt;
  color: var(--purple); line-height: 1.1; letter-spacing: -0.02em;
}
.t-h2 {
  font-family: var(--font-ui); font-weight: 700; font-size: 15pt;
  color: var(--ink); line-height: 1.15; letter-spacing: -0.01em;
}
.t-lead { font-size: 12pt; color: var(--ink-2); line-height: 1.6; }
.t-body { font-size: 11pt; color: var(--ink); line-height: 1.6; }
.t-caption { font-family: var(--font-ui); font-size: 8.5pt; color: var(--ink-3); }
.t-quote {
  font-family: var(--font-serif); font-style: italic;
  font-size: 13pt; line-height: 1.4; color: var(--purple);
}
.orange-text { color: var(--orange); }
.num-serif {
  font-family: var(--font-serif); font-style: italic;
  color: var(--orange); line-height: 1;
}

/* ── Orange dot device ────────────────────────────────────────── */
.dot-device {
  width: 10px; height: 10px;
  border-radius: 50%; background: var(--orange); display: inline-block;
}
.dot-device.lg { width: 16px; height: 16px; }

/* ── Score components ─────────────────────────────────────────── */
.qoe-big {
  font-family: var(--font-ui); font-weight: 900;
  font-size: 72pt; line-height: 0.9;
  color: var(--purple); letter-spacing: -0.04em;
}
.qoe-label {
  font-family: var(--font-ui); font-weight: 600;
  font-size: 9pt; letter-spacing: 0.14em;
  text-transform: uppercase;
}
.nivel-badge {
  display: inline-block;
  font-family: var(--font-ui); font-weight: 700; font-size: 8pt;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 3px 10px; border-radius: 999px;
}
.nivel-propulsor { background: rgba(31,138,91,0.12); color: var(--success); }
.nivel-atencao   { background: rgba(181,139,44,0.12); color: var(--warn); }
.nivel-teto      { background: rgba(194,65,42,0.12); color: var(--danger); }

/* Score bar */
.score-row { margin-bottom: 10px; }
.score-row-label {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 3px;
}
.score-bar-track {
  height: 6px; background: var(--hairline); border-radius: 3px; overflow: hidden;
}
.score-bar-fill {
  height: 100%; border-radius: 3px;
  background: var(--purple);
  transition: width 0.8s ease;
}
.score-bar-fill.propulsor { background: var(--success); }
.score-bar-fill.atencao   { background: var(--warn); }
.score-bar-fill.teto      { background: var(--danger); }

/* ── Divider ──────────────────────────────────────────────────── */
.divider {
  width: 60px; height: 2px; background: var(--orange); border-radius: 1px;
  margin: 20px 0;
}

/* ── Callouts ─────────────────────────────────────────────────── */
.callout {
  padding: 14px 16px; border-radius: 2px;
  margin: 14px 0;
}
.callout-insight { background: var(--purple-tint); border-left: 3px solid var(--purple); }
.callout-alerta  { background: var(--bone); border-left: 3px solid var(--orange); }
.callout-teto    { background: rgba(194,65,42,0.06); border-left: 3px solid var(--danger); }

/* ── Dimension individual page ────────────────────────────────── */
.dim-num {
  font-family: var(--font-serif); font-style: italic;
  font-size: 80pt; line-height: 0.85;
  color: var(--orange); opacity: 0.18;
  position: absolute; top: 32px; right: 48px;
  font-weight: 400; user-select: none;
}

/* ── Plan page ────────────────────────────────────────────────── */
.field-line {
  border-bottom: 1px solid var(--hairline-s);
  height: 28px; margin-bottom: 8px;
}
.field-block {
  border: 1px solid var(--hairline-s);
  border-radius: 4px; min-height: 60px;
  padding: 8px; margin-bottom: 12px;
}

/* ── Radar chart ──────────────────────────────────────────────── */
.chart-wrap { width: 320px; height: 320px; margin: 0 auto; }

/* ── Table of scores ──────────────────────────────────────────── */
.score-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
.score-table th, .score-table td {
  padding: 6px 10px; text-align: left;
  border-bottom: 1px solid var(--hairline);
  font-size: 9.5pt;
}
.score-table th {
  font-family: var(--font-ui); font-weight: 600; font-size: 8pt;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); background: var(--bone);
}
.score-table .td-score { font-weight: 700; font-size: 11pt; }

/* ── Footer ───────────────────────────────────────────────────── */
.page-footer {
  position: absolute; bottom: 24px; left: 60px; right: 52px;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--hairline);
  padding-top: 8px;
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div style="display:flex;gap:6px">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <p>Gerando seu relatório</p>
</div>

<!-- TOOLBAR -->
<div class="toolbar no-print">
  <button class="btn btn-secondary" onclick="window.history.back()">← Voltar</button>
  <button class="btn btn-primary" onclick="window.print()">↓ Baixar PDF</button>
</div>

<!-- REPORT -->
<div class="report-wrap" id="report" style="display:none"></div>

<script>
// ── Helpers ──────────────────────────────────────────────────────────────────
function nivelClass(n){ return n==='propulsor'?'propulsor':n==='atencao'?'atencao':'teto'; }
function nivelLabel(n){ return n==='propulsor'?'Propulsor':n==='atencao'?'Atenção':'Teto'; }
function nivelBadge(n){ return `<span class="nivel-badge nivel-${nivelClass(n)}">${nivelLabel(n)}</span>`; }
function scoreBar(score,nivel){
  const cls = nivelClass(nivel);
  return `
    <div class="score-bar-track" style="margin-top:8px;margin-bottom:4px">
      <div class="score-bar-fill ${cls}" style="width:${score}%"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="t-caption">${score}/100</span>
      ${nivelBadge(nivel)}
    </div>`;
}
function fmtData(iso){
  try { return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}); }
  catch{ return iso; }
}
function pageFooter(pg, nome){
  return `<div class="page-footer">
    <span class="t-caption" style="color:var(--ink-4)">Assessment de Evoluabilidade™ · ${nome}</span>
    <span class="t-caption" style="color:var(--ink-4)">Página ${pg}</span>
  </div>`;
}

const DIMS_ORDER = ['D1','D2','D3','D4','D5','D6','D7','D8','D9'];

// ── Render ────────────────────────────────────────────────────────────────────
function render(data){
  const { nome, par, data: dt, QoE, dimensoes, gerado, meta } = data;
  const wrap = document.getElementById('report');
  let html = '';

  // ── P1: CAPA ───────────────────────────────────────────────────────────────
  html += `<div class="page" style="justify-content:space-between">
  <div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:48px">
      <span class="dot-device lg"></span>
      <span class="eyebrow purple" style="margin-top:2px">Evoluabilidade™</span>
    </div>
    <div class="eyebrow" style="margin-bottom:12px">RELATÓRIO DE ASSESSMENT</div>
    <div class="display">${nome}<span class="orange-text">.</span></div>
    <div class="divider" style="margin-top:32px"></div>
    <div style="margin-top:24px">
      <div class="qoe-big">${QoE}</div>
      <div class="qoe-label" style="margin-top:4px">
        QoE — Quociente de Evoluabilidade<span style="color:var(--orange)">.</span>
      </div>
      <div class="t-caption" style="margin-top:8px;color:var(--ink-3)">Escala 0–100 · Leitura exploratória — instrumento em validação</div>
    </div>
  </div>
  <div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:40px">
      <div>
        <div class="eyebrow" style="margin-bottom:4px">Par</div>
        <div class="t-body" style="font-weight:600">${par}</div>
      </div>
      <div>
        <div class="eyebrow" style="margin-bottom:4px">Data</div>
        <div class="t-body">${fmtData(dt)}</div>
      </div>
    </div>
    <div class="page-footer" style="position:relative;bottom:0;left:0;right:0">
      <span class="t-caption" style="color:var(--ink-4)">Daniel Scharf · ECC — Engenharia Comportamental de Crescimento</span>
      <span class="t-caption" style="color:var(--ink-4)">Página 1</span>
    </div>
  </div>
</div>`;

  // ── P2: SOBRE ESTE INSTRUMENTO ─────────────────────────────────────────────
  html += `<div class="page">
  <div class="eyebrow purple" style="margin-bottom:20px">Sobre este instrumento</div>
  <h1 class="t-h1" style="margin-bottom:8px">O que é a Evoluabilidade<span class="orange-text">.</span></h1>
  <p class="t-lead" style="margin-bottom:20px">${gerado.descricaoGeral || ''}</p>
  <div class="divider"></div>
  
  <div class="callout callout-insight" style="margin-bottom:16px">
    <div class="eyebrow orange" style="margin-bottom:6px">Definição canônica</div>
    <p class="t-quote">Evoluabilidade é a capacidade dinâmica de identificar os próprios tetos comportamentais, atravessá-los e sustentar o novo nível de forma consciente e mensurável — mesmo sob pressão, mudança e complexidade.</p>
    <div class="t-caption" style="margin-top:8px">— Daniel Scharf, 2026</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px">
    <div>
      <div class="eyebrow" style="margin-bottom:8px;color:var(--success)">O que este relatório mede</div>
      <p class="t-body">A organização interna atual em 9 Dimensões que estruturam a capacidade de evoluir: identidade, emoção, propósito, padrões limitantes, ruído mental, agência, adaptabilidade, relações e vitalidade.</p>
      <p class="t-body" style="margin-top:8px">O QoE reflete o estado atual do sistema — não o potencial máximo.</p>
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom:8px;color:var(--danger)">O que este relatório NÃO mede</div>
      <p class="t-body">Inteligência, personalidade, QI ou traços estáveis. Não prevê resultados profissionais. Não é diagnóstico clínico. O Índice de Trajetória (IT) requer medição longitudinal e não está disponível nesta primeira aplicação.</p>
      <p class="t-body" style="margin-top:8px">Os resultados são uma leitura interpretativa exploratória. O instrumento está em fase de validação de conteúdo (beta).</p>
    </div>
  </div>

  <div class="callout callout-alerta" style="margin-top:20px">
    <p class="t-body"><strong>Como usar este relatório:</strong> Leia o perfil completo antes de focar nos pontos de atenção. Identifique os padrões que ressoam, não apenas os escores. O plano de ação na última página é o único produto útil desta leitura.</p>
  </div>
  ${pageFooter(2, nome)}
</div>`;

  // ── P3: PERFIL VISUAL ──────────────────────────────────────────────────────
  const labels = DIMS_ORDER.map(d => dimensoes[d]?.nome || d);
  const scores = DIMS_ORDER.map(d => dimensoes[d]?.score || 0);
  
  html += `<div class="page">
  <div class="eyebrow purple" style="margin-bottom:20px">Perfil das 9 Dimensões</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1">
    <div class="chart-wrap" style="width:100%;height:auto;max-height:360px">
      <canvas id="radarChart"></canvas>
    </div>
    <div>
      <table class="score-table">
        <thead><tr>
          <th>Dimensão</th><th>Escore</th><th>Status</th>
        </tr></thead>
        <tbody>
          ${DIMS_ORDER.map(d => {
            const dim = dimensoes[d];
            if(!dim) return '';
            return `<tr>
              <td>
                <div style="font-weight:600;font-size:9.5pt">${d} ${dim.nome}</div>
                <div class="t-caption">${dim.papel}</div>
              </td>
              <td class="td-score">${dim.score}</td>
              <td>${nivelBadge(dim.nivel)}</td>
            </tr>`;
          }).join('')}
          <tr style="border-top:2px solid var(--hairline-s)">
            <td><strong>QoE Geral</strong></td>
            <td class="td-score" style="color:var(--purple)">${QoE}</td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--hairline)">
    <div style="display:flex;gap:20px">
      <div style="display:flex;align-items:center;gap:6px">
        <div style="width:12px;height:12px;border-radius:2px;background:var(--success)"></div>
        <span class="t-caption">Propulsor (≥ 70)</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <div style="width:12px;height:12px;border-radius:2px;background:var(--warn)"></div>
        <span class="t-caption">Atenção (50–69)</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <div style="width:12px;height:12px;border-radius:2px;background:var(--danger)"></div>
        <span class="t-caption">Teto (&lt; 50)</span>
      </div>
    </div>
  </div>
  ${pageFooter(3, nome)}
</div>`;

  // ── P4–P12: DIMENSÕES INDIVIDUAIS ─────────────────────────────────────────
  const ROLECOLOR = { FUNDAMENTO: '#E8734A', ATIVADOR: '#2D2A5E', Diagnóstico: '#6E6A85', 'Base biológica': '#6E6A85' };
  
  DIMS_ORDER.forEach((dKey, i) => {
    const dim = dimensoes[dKey];
    const desc = gerado.dimensoes?.[dKey]?.descricao || '—';
    const nivel = dim?.nivel || 'atencao';
    const pg = i + 4;
    const numStr = String(i + 1).padStart(2,'0');
    const roleColor = ROLECOLOR[dim?.papel] || 'var(--ink-3)';

    html += `<div class="page">
  <div class="dim-num">${numStr}</div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
    <span class="eyebrow orange">${dKey}</span>
    <span style="width:1px;height:12px;background:var(--hairline)"></span>
    <span class="eyebrow" style="color:${roleColor}">${dim?.papel || ''}</span>
  </div>
  <h2 class="t-h1" style="font-size:26pt;margin-bottom:4px">${dim?.nome || dKey}<span class="orange-text">.</span></h2>
  <div class="t-caption" style="color:var(--ink-3);margin-bottom:24px">${dim?.tecnico || ''}</div>
  
  <div style="margin-bottom:20px">
    ${scoreBar(dim?.score || 0, nivel)}
  </div>
  
  <div class="divider"></div>
  
  <p class="t-body" style="margin-top:20px;max-width:56ch;line-height:1.7">${desc}</p>
  
  ${(dKey === 'D1') ? `<div class="callout callout-insight" style="margin-top:24px">
    <p class="t-body"><strong>D1 é o fundamento.</strong> Escores baixos aqui explicam padrões em outras dimensões. Intervir nas outras sem trabalhar D1 é tratar sintoma sem causa.</p>
  </div>` : ''}
  
  ${(dKey === 'D6') ? `<div class="callout callout-alerta" style="margin-top:24px">
    <p class="t-body"><strong>D6 é o ativador.</strong> Sem Autoria Consciente, o entendimento de qualquer outra dimensão não se converte em movimento.</p>
  </div>` : ''}

  ${pageFooter(pg, nome)}
</div>`;
  });

  // ── P13: TETOS IDENTIFICADOS ───────────────────────────────────────────────
  const pg13 = 13;
  const tetos = gerado.tetos || [];
  html += `<div class="page">
  <div class="eyebrow purple" style="margin-bottom:20px">Tetos Identificados</div>
  <h2 class="t-h1" style="margin-bottom:8px">Os padrões que travam o sistema<span class="orange-text">.</span></h2>
  <p class="t-lead" style="margin-bottom:28px">Um teto é um padrão sistêmico — não uma fraqueza isolada. É a combinação de dimensões que produz o comportamento-fronteira que o sistema evita.</p>
  <div class="divider"></div>
  <div style="margin-top:24px;display:flex;flex-direction:column;gap:16px">
    ${tetos.length ? tetos.map((t,i) => `
      <div class="callout callout-teto">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span class="num-serif" style="font-size:22pt">${String(i+1).padStart(2,'0')}</span>
          <div>
            <div style="font-family:var(--font-ui);font-weight:700;font-size:12pt;color:var(--ink)">${t.nome}</div>
            <div class="t-caption">${(t.dimensoes||[]).join(' · ')}</div>
          </div>
        </div>
        <p class="t-body">${t.descricao}</p>
      </div>`) .join('') : '<p class="t-body" style="color:var(--ink-3)">Nenhum teto crítico identificado neste perfil.</p>'}
  </div>
  ${pageFooter(pg13, nome)}
</div>`;

  // ── P14: BINÁRIOS COMPORTAMENTAIS ─────────────────────────────────────────
  const binarios = gerado.binarios || [];
  html += `<div class="page">
  <div class="eyebrow purple" style="margin-bottom:20px">Binários Comportamentais</div>
  <h2 class="t-h1" style="margin-bottom:8px">Os comportamentos que atravessam<span class="orange-text">.</span></h2>
  <p class="t-lead" style="margin-bottom:8px">O Binário Comportamental é uma intervenção neurobiológica — não uma técnica de produtividade. A pergunta é Sim/Não. A execução, sem deliberação.</p>
  <div class="callout callout-insight" style="margin-bottom:24px">
    <p class="t-body">Escolha UM binário. Execute por 21 dias com a frequência indicada. Só então adicione o segundo.</p>
  </div>
  <div class="divider"></div>
  <div style="margin-top:20px;display:flex;flex-direction:column;gap:14px">
    ${binarios.length ? binarios.map((b,i) => `
      <div style="background:var(--paper);border:1px solid var(--hairline);border-radius:6px;padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <span class="eyebrow orange">Binário ${i+1} · ${b.dimensao||''}</span>
          <span style="font-family:var(--font-ui);font-weight:700;font-size:8pt;background:var(--purple-tint);color:var(--purple);padding:2px 8px;border-radius:999px">${b.frequencia||''}</span>
        </div>
        <p style="font-family:var(--font-ui);font-weight:600;font-size:11pt;color:var(--ink);margin-bottom:6px">${b.pergunta}</p>
        <p class="t-caption">${b.impacto||''}</p>
      </div>`) .join('') : '<p class="t-body" style="color:var(--ink-3)">Binários serão sugeridos na próxima sessão.</p>'}
  </div>
  ${pageFooter(14, nome)}
</div>`;

  // ── P15: PLANO DE AÇÃO ────────────────────────────────────────────────────
  html += `<div class="page">
  <div class="eyebrow purple" style="margin-bottom:20px">Plano de Ação</div>
  <h2 class="t-h1" style="margin-bottom:8px">O que muda a partir de agora<span class="orange-text">.</span></h2>
  <p class="t-body" style="margin-bottom:24px">Preencha abaixo. Este é o único campo que importa depois da leitura.</p>
  <div class="divider"></div>
  
  <div style="margin-top:24px">
    <div class="eyebrow" style="margin-bottom:6px">O binário que escolho</div>
    <div class="field-block" style="min-height:44px"></div>
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px">
      <div>
        <div class="eyebrow" style="margin-bottom:6px">Frequência</div>
        <div class="field-line"></div>
      </div>
      <div>
        <div class="eyebrow" style="margin-bottom:6px">Começo em</div>
        <div class="field-line"></div>
      </div>
    </div>

    <div class="eyebrow" style="margin-bottom:6px">O que quero observar em 30 dias</div>
    <div class="field-block"></div>

    <div class="eyebrow" style="margin-bottom:6px">O que precisa mudar na semana que vem</div>
    <div class="field-block"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:4px">
      <div>
        <div class="eyebrow" style="margin-bottom:6px">Data de revisão (30 dias)</div>
        <div class="field-line"></div>
      </div>
      <div>
        <div class="eyebrow" style="margin-bottom:6px">Parceiro de accountability</div>
        <div class="field-line"></div>
      </div>
    </div>
  </div>

  <div class="callout callout-insight" style="margin-top:20px">
    <p class="t-quote">"O PTE não é o comportamento mais fácil. É o comportamento que o sistema mais evita — porque é exatamente ali que a transformação está esperando."</p>
    <div class="t-caption" style="margin-top:6px">— Daniel Scharf</div>
  </div>

  <div class="page-footer" style="position:absolute;bottom:24px;left:60px;right:52px">
    <span class="t-caption" style="color:var(--ink-4)">Assessment de Evoluabilidade™ · ${meta?.versao || 'beta'} · danielscharf.com.br</span>
    <span class="t-caption" style="color:var(--ink-4)">Página 15</span>
  </div>
</div>`;

  wrap.innerHTML = html;
  wrap.style.display = 'flex';
  document.getElementById('loading').style.display = 'none';

  // ── Radar Chart ───────────────────────────────────────────────────────────
  const ctx = document.getElementById('radarChart');
  if(ctx){
    new Chart(ctx, {
      type: 'radar',
      data: {
        labels: labels,
        datasets: [{
          data: scores,
          backgroundColor: 'rgba(45,42,94,0.08)',
          borderColor: '#2D2A5E',
          borderWidth: 2,
          pointBackgroundColor: scores.map(s => s>=70?'#1F8A5B':s>=50?'#B58B2C':'#C2412A'),
          pointRadius: 4,
          pointHoverRadius: 6,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: true,
        scales: {
          r: {
            min: 0, max: 100,
            ticks: { stepSize: 25, font: { size: 9 }, color: '#A09DB1', backdropColor: 'transparent' },
            grid: { color: '#E5E2DA' },
            angleLines: { color: '#E5E2DA' },
            pointLabels: { font: { size: 8.5, family: 'Inter Tight', weight: '600' }, color: '#3D3A5C' }
          }
        },
        plugins: { legend: { display: false } }
      }
    });
  }
}

// ── Fetch & render ────────────────────────────────────────────────────────────
(async () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('loading').innerHTML = '<p style="font-family:Inter;color:#C2412A;padding:32px">ID do relatório não encontrado na URL.</p>';
    return;
  }

  try {
    const r = await fetch(`/api/relatorio?id=${id}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    render(data);
  } catch(e) {
    document.getElementById('loading').innerHTML = `<p style="font-family:Inter;color:#C2412A;padding:32px">Erro ao carregar relatório: ${e.message}</p>`;
  }
})();
</script>
</body>
</html>
