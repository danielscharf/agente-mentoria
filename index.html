<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#534AB7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agente DS">
<title>Agente · Daniel Scharf</title>
<link rel="manifest" href="/manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --purple: #534AB7; --purple-light: #EEEDFE; --purple-dark: #3C3489;
    --green: #0F6E56; --amber: #BA7517;
    --bg: #FFFFFF; --bg2: #F8F7F5; --bg3: #F0EFE9;
    --text: #1A1A18; --text2: #6B6B65; --text3: #9B9B93;
    --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
    --radius: 14px; --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A1C; --bg2: #242428; --bg3: #2E2E34;
      --text: #E8E8E0; --text2: #A0A098; --text3: #6A6A62;
      --border: rgba(255,255,255,0.10); --border2: rgba(255,255,255,0.18);
    }
  }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 480px; margin: 0 auto; }
  
  /* HEADER */
  .hdr { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
  .hdr-left { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--purple); display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .hdr-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .hdr-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .view-btn { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; font-family: inherit; transition: all .15s; }
  .view-btn.active { background: var(--purple); color: white; border-color: var(--purple); }

  /* MESSAGES */
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .msg { max-width: 85%; padding: 11px 14px; border-radius: 18px; font-size: 15px; line-height: 1.55; word-break: break-word; }
  .msg.agent { background: var(--bg2); border: 1px solid var(--border); border-bottom-left-radius: 4px; align-self: flex-start; color: var(--text); }
  .msg.user { background: var(--purple); color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
  .msg.typing { background: var(--bg2); border: 1px solid var(--border); align-self: flex-start; padding: 14px 18px; }
  .dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text3); margin: 0 2px; animation: pulse 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%,80%,100%{opacity:.2;transform:scale(.9)} 40%{opacity:1;transform:scale(1)} }
  .msg-time { font-size: 11px; color: var(--text3); margin-top: 3px; }

  /* START SCREEN */
  .start { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
  .start-icon { width: 72px; height: 72px; border-radius: 20px; background: var(--purple-light); display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 20px; }
  .start h2 { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
  .start p { font-size: 15px; color: var(--text2); line-height: 1.6; margin-bottom: 28px; max-width: 300px; }
  .start-btn { background: var(--purple); color: white; border: none; border-radius: 50px; padding: 14px 36px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; letter-spacing: .3px; transition: transform .1s, opacity .15s; }
  .start-btn:active { transform: scale(.97); }

  /* INPUT */
  .inp-row { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; background: var(--bg2); flex-shrink: 0; }
  .chat-inp { flex: 1; background: var(--bg); border: 1.5px solid var(--border2); border-radius: 22px; padding: 10px 16px; font-size: 15px; font-family: inherit; color: var(--text); resize: none; max-height: 120px; outline: none; line-height: 1.4; transition: border-color .15s; }
  .chat-inp:focus { border-color: var(--purple); }
  .send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--purple); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity .15s, transform .1s; }
  .send-btn:disabled { opacity: .35; cursor: not-allowed; }
  .send-btn:not(:disabled):active { transform: scale(.92); }

  /* MENTOR VIEW */
  .mentor { flex: 1; overflow-y: auto; padding: 16px; }
  .profile-box { background: var(--purple-light); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .profile-name { font-size: 16px; font-weight: 600; color: var(--purple-dark); margin-bottom: 4px; }
  .profile-meta { font-size: 13px; color: var(--purple); margin-bottom: 10px; }
  .tag { display: inline-block; background: white; border: 1px solid #AFA9EC; border-radius: 10px; padding: 2px 9px; font-size: 12px; color: var(--purple-dark); margin: 2px; }
  .lever { font-size: 12px; color: var(--purple-dark); margin-top: 8px; font-weight: 500; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin: 16px 0 10px; }
  .conv-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px; }
  .conv-date { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .conv-line { font-size: 13px; line-height: 1.55; margin-bottom: 4px; }
  .conv-line.u { color: var(--text2); font-style: italic; }
  .conv-line.a { color: var(--text); }
  .label-u { font-size: 11px; font-weight: 600; color: var(--green); }
  .label-a { font-size: 11px; font-weight: 600; color: var(--purple); }
  .empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
  .clear-btn { background: transparent; border: 1.5px solid var(--border2); border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer; color: var(--text2); font-family: inherit; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ─── CLIENT PROFILES ───────────────────────────────────────────────────────
const PROFILES = {
  lourenco: {
    name: "Lourenço",
    avatar: "LG",
    age: 27,
    company: "Gerdau (6ª geração da família, linha materna)",
    moment: "Job rotation: comercial → industrial → metálicos → mineração (Centro de Distribuição RJ)",
    goal: "Decidir trajetória executiva vs. acionista até dezembro/2026. Possível pós-graduação nos EUA em 2027 (finanças/business).",
    lever: "Comunicação e posicionamento assertivo",
    themes: ["Comunicação assertiva", "Formação de aliados", "Flow e autenticidade", "Decisão de carreira 2027"],
    challenges: "Autocensura pelo sobrenome Gerdau; timidez em negociações comerciais; excesso de análise antes de falar; receio de parecer prepotente.",
    salary: "R$ 5.500/mês (integração sem metas formais)",
    context: "Sessões quinzenais às 19h30 (online/presencial Leblon-Ipanema). Assessment TTI TriMetrix DNA em andamento."
  },
  default: {
    name: "Cliente",
    avatar: "DS",
    age: null,
    company: "Não configurado",
    moment: "Perfil não carregado",
    goal: "Adicionar ?cliente=NOME na URL",
    lever: "A definir",
    themes: ["A definir"],
    challenges: "Configure o perfil via parâmetro URL",
    salary: "",
    context: ""
  }
};

function getProfile() {
  const params = new URLSearchParams(window.location.search);
  const key = (params.get("cliente") || "").toLowerCase();
  return PROFILES[key] || PROFILES.default;
}

function isMentorView() {
  const params = new URLSearchParams(window.location.search);
  return params.get("view") === "mentor";
}

const profile = getProfile();

function buildSystemPrompt(p) {
  return `Você é o Assistente de Desenvolvimento do Daniel Scharf — mentor de alta performance com 15+ anos de experiência. Você acompanha ${p.name} entre as sessões de mentoria presencial com Daniel.

PERFIL DO CLIENTE:
Nome: ${p.name}${p.age ? ", " + p.age + " anos" : ""}
Empresa/Contexto: ${p.company}
Momento atual: ${p.moment}
Objetivo principal: ${p.goal}
Ponto de alavanca identificado por Daniel: ${p.lever}
Desafios ativos: ${p.challenges}
${p.context ? "Contexto adicional: " + p.context : ""}

TEMAS ATIVOS DO PROCESSO:
${p.themes.map((t, i) => `${i+1}. ${t}`).join("\n")}

COMO VOCÊ ATUA:
- Faça perguntas reflexivas e poderosas — nunca dê conselhos diretos ou diagnósticos
- Uma pergunta de cada vez; espere a resposta antes de avançar
- Linguagem próxima, direta, sem jargão psicológico pesado
- Em cada check-in padrão, cubra na sequência:
  1. O que ${p.name} se comprometeu a fazer desde a última sessão
  2. O que ele(a) realmente fez (sem julgamento, com curiosidade)
  3. O que aprendeu sobre si mesmo(a) nesse processo
  4. Uma pergunta de crescimento conectada ao tema ativo do momento
- Ao concluir, faça uma síntese de 2 linhas do que ficou mais vivo — para ele(a) levar à próxima sessão com Daniel
- Quando surgir material importante e profundo, sinalize: "Isso é gold para a próxima sessão com o Daniel."
- Mensagens curtas: máximo 3 parágrafos. Prefira 1-2.

LIMITES INEGOCIÁVEIS:
- Nunca substitua o papel clínico do Daniel
- Nunca faça diagnósticos de perfil comportamental
- Se ${p.name} trouxer algo emocionalmente pesado, acolha e sinalize para Daniel
- Nunca seja genérico — sempre referencie algo que ${p.name} trouxe

TOM:
Próximo, como alguém que conhece bem a pessoa e o processo. Direto, sem rodeios, mas genuinamente interessado.`;
}

// ─── STATE ─────────────────────────────────────────────────────────────────
let messages = [];
let loading = false;
let started = false;
let view = isMentorView() ? "mentor" : "chat";
let history = [];

// Load stored history
(async () => {
  try {
    const r = await window.storage.get("history_" + (new URLSearchParams(window.location.search).get("cliente") || "default"));
    if (r) history = JSON.parse(r.value);
  } catch(e) {}
  render();
})();

async function saveHistory() {
  try {
    const clientKey = (new URLSearchParams(window.location.search).get("cliente") || "default");
    const entry = { date: new Date().toISOString(), messages: [...messages] };
    const updated = [entry, ...history].slice(0, 30);
    history = updated;
    await window.storage.set("history_" + clientKey, JSON.stringify(updated));
  } catch(e) {}
}

// ─── API ────────────────────────────────────────────────────────────────────
async function callAPI(convHistory) {
  const apiMessages = convHistory.map(m => ({
    role: m.role === "user" ? "user" : "assistant",
    content: m.text
  }));
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 500,
      system: buildSystemPrompt(profile),
      messages: apiMessages
    })
  });
  if (!res.ok) throw new Error("API error " + res.status);
  const data = await res.json();
  return data.content?.[0]?.text || "Pode continuar...";
}

// ─── ACTIONS ────────────────────────────────────────────────────────────────
async function startChat() {
  started = true;
  loading = true;
  render();
  try {
    const text = await callAPI([{ role: "user", text: "Oi, estou aqui para o check-in de hoje." }]);
    messages = [
      { role: "agent", text, ts: Date.now() }
    ];
  } catch(e) {
    messages = [{ role: "agent", text: `Olá, ${profile.name}! Que bom ter você aqui. Vamos ao check-in. Para começar: o que você se comprometeu a fazer desde a última sessão com o Daniel?`, ts: Date.now() }];
  }
  loading = false;
  render();
}

async function sendMessage(text) {
  if (!text.trim() || loading) return;
  const userMsg = { role: "user", text: text.trim(), ts: Date.now() };
  messages = [...messages, userMsg];
  loading = true;
  render();
  try {
    const reply = await callAPI(messages);
    const agentMsg = { role: "agent", text: reply, ts: Date.now() };
    messages = [...messages, agentMsg];
    if (messages.length >= 6) saveHistory();
  } catch(e) {
    messages = [...messages, { role: "agent", text: "Tive uma dificuldade de conexão. Pode repetir?", ts: Date.now() }];
  }
  loading = false;
  render();
}

function toggleView() {
  view = view === "chat" ? "mentor" : "chat";
  render();
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  
  // SVG Send icon
  const sendSVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`;

  const headerHTML = `
    <div class="hdr">
      <div class="hdr-left">
        <div class="avatar">${profile.avatar || "DS"}</div>
        <div>
          <div class="hdr-name">Assistente · Daniel Scharf</div>
          <div class="hdr-sub">${profile.name}</div>
        </div>
      </div>
      <button class="view-btn ${view === "mentor" ? "active" : ""}" onclick="toggleView()">
        ${view === "mentor" ? "← Chat" : "Mentor ↗"}
      </button>
    </div>`;

  if (view === "mentor") {
    const allConvs = messages.length > 0 
      ? [{ date: new Date().toISOString(), messages }, ...history]
      : history;
    
    app.innerHTML = headerHTML + `
      <div class="mentor">
        <div class="profile-box">
          <div class="profile-name">${profile.name}${profile.age ? " · " + profile.age + " anos" : ""}</div>
          <div class="profile-meta">${profile.company}</div>
          ${profile.themes.map(t => `<span class="tag">${t}</span>`).join("")}
          <div class="lever">Alavanca: ${profile.lever}</div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="section-title">Histórico de check-ins (${allConvs.length})</div>
          ${allConvs.length > 0 ? `<button class="clear-btn" onclick="clearHistory()">Limpar</button>` : ""}
        </div>

        ${allConvs.length === 0 ? `<div class="empty">Nenhum check-in registrado ainda.</div>` : 
          allConvs.slice(0, 5).map(conv => `
            <div class="conv-card">
              <div class="conv-date">${new Date(conv.date).toLocaleDateString("pt-BR", {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})} · ${conv.messages.filter(m=>m.role==="user").length} resp.</div>
              ${conv.messages.slice(-4).map(m => `
                <div class="${m.role === "user" ? "label-u" : "label-a"}">${m.role === "user" ? profile.name : "Agente"}</div>
                <div class="conv-line ${m.role === "user" ? "u" : "a"}">${m.text.length > 180 ? m.text.slice(0, 180) + "..." : m.text}</div>
              `).join("")}
            </div>
          `).join("")
        }
      </div>`;
    return;
  }

  if (!started) {
    app.innerHTML = headerHTML + `
      <div class="start">
        <div class="start-icon">⚡</div>
        <h2>Check-in com Daniel Scharf</h2>
        <p>Seu espaço de reflexão entre as sessões. Rápido, direto e conectado ao seu processo.</p>
        <button class="start-btn" onclick="startChat()">Iniciar check-in</button>
      </div>`;
    return;
  }

  const msgsHTML = messages.map(m => `
    <div class="msg ${m.role}">
      ${m.text.replace(/\n/g, "<br>")}
      <div class="msg-time">${formatTime(m.ts)}</div>
    </div>
  `).join("");

  const typingHTML = loading ? `
    <div class="msg typing">
      <div class="dots"><span></span><span></span><span></span></div>
    </div>` : "";

  app.innerHTML = headerHTML + `
    <div class="msgs" id="msgs">${msgsHTML}${typingHTML}<div id="bottom"></div></div>
    <div class="inp-row">
      <textarea class="chat-inp" id="inp" placeholder="Escreva aqui..." rows="1"
        onkeydown="handleKey(event)" oninput="resize(this)" ${loading ? "disabled" : ""}></textarea>
      <button class="send-btn" id="sbtn" onclick="doSend()" ${loading ? "disabled" : ""}>${sendSVG}</button>
    </div>`;
  
  document.getElementById("bottom")?.scrollIntoView({ behavior: "smooth" });
  if (!loading) document.getElementById("inp")?.focus();
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    doSend();
  }
}

function resize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

function doSend() {
  const inp = document.getElementById("inp");
  if (inp) { sendMessage(inp.value); inp.value = ""; inp.style.height = "auto"; }
}

async function clearHistory() {
  if (!confirm("Limpar histórico de check-ins?")) return;
  history = [];
  messages = [];
  started = false;
  try {
    const clientKey = (new URLSearchParams(window.location.search).get("cliente") || "default");
    await window.storage.delete("history_" + clientKey);
  } catch(e) {}
  render();
}

// ─── INIT ───────────────────────────────────────────────────────────────────
window.startChat = startChat;
window.doSend = doSend;
window.handleKey = handleKey;
window.resize = resize;
window.toggleView = toggleView;
window.clearHistory = clearHistory;
render();
</script>
</body>
</html>
