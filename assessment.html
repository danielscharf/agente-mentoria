<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4B43A8">
<title>Assessment de Evoluabilidade · Daniel Scharf</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--p:#4B43A8;--pl:#ECEAFC;--pd:#2D2870;--bg:#F8F7F4;--white:#fff;--text:#1A1A20;--t2:#4A4A52;--t3:#8A8A95;--serif:'Playfair Display',serif;--sans:'DM Sans',sans-serif}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--white);border-radius:16px;padding:24px;margin-bottom:14px;border:1px solid rgba(0,0,0,.07);box-shadow:0 1px 8px rgba(0,0,0,.04)}
h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px}
.sub{font-size:14px;color:var(--t3);margin-bottom:16px}
.icon{width:64px;height:64px;background:var(--pl);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px}
.name-inp{width:100%;border:1.5px solid #E0DED8;border-radius:10px;padding:12px 14px;font-size:15px;font-family:var(--sans);color:var(--text);background:#FAFAF8;margin-bottom:16px;outline:none;transition:border-color .15s}
.name-inp:focus{border-color:var(--p)}
.prog{height:4px;background:#E8E6E0;border-radius:2px;margin:12px 0 20px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .4s}
.q-cnt{font-size:12px;color:var(--t3);margin-bottom:8px}
.q-text{font-size:17px;line-height:1.55;margin-bottom:20px}
.likert{display:flex;flex-direction:column;gap:8px}
.lb{background:var(--white);border:1.5px solid #E0DED8;border-radius:12px;padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text);transition:all .12s;text-align:left;font-family:var(--sans)}
.lb:hover{border-color:var(--p);background:var(--pl)}
.ln{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;background:#F0EFE9;color:var(--t3);transition:all .12s}
.btn-main{background:var(--p);color:white;border:none;border-radius:50px;padding:15px 32px;font-size:16px;font-weight:600;cursor:pointer;width:100%;font-family:var(--sans);letter-spacing:.2px;transition:transform .1s,opacity .15s}
.btn-main:hover{opacity:.9}
.btn-main:active{transform:scale(.98)}
.btn-sec{background:transparent;border:1.5px solid #D0CEC8;border-radius:50px;padding:12px 24px;font-size:14px;cursor:pointer;width:100%;margin-top:10px;font-family:var(--sans);color:var(--t2)}
.btn-report{background:linear-gradient(135deg,var(--pd),var(--p));color:white;border:none;border-radius:50px;padding:15px 32px;font-size:15px;font-weight:600;cursor:pointer;width:100%;font-family:var(--sans);margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.idx-wrap{text-align:center;padding:24px 20px}
.idx-num{font-family:var(--serif);font-size:64px;font-weight:700;color:var(--p);line-height:1;letter-spacing:-2px}
.idx-num span{font-size:22px;color:var(--t3);font-family:var(--sans);font-weight:300;letter-spacing:0}
.idx-lv{font-size:18px;font-weight:600;margin:8px 0 10px}
.idx-desc{font-size:14px;color:var(--t2);line-height:1.7;max-width:300px;margin:0 auto}
.sc-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sc-name{font-size:13px;color:var(--t2);flex:1;font-weight:500}
.sc-bar{width:72px;height:6px;background:#E8E6E0;border-radius:3px;overflow:hidden}
.sc-fill{height:100%;border-radius:3px}
.sc-val{font-size:13px;font-weight:700;min-width:26px;text-align:right}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px}
.ph{background:#EAF3DE;color:#2D6B0E}
.pm{background:#FFF3DE;color:#7A4A00}
.pl{background:#FCEBEB;color:#7A1414}
.radar-wrap{text-align:center;margin:16px 0 8px}
.dim-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
const DIMS=[
  {id:"meta",name:"Metacognição",color:"#4B43A8",qs:["Quando reajo de forma que não me agrada, consigo identificar rapidamente o que me levou a agir assim.","Percebo meus padrões de comportamento se repetindo em situações semelhantes.","Consigo observar meus próprios pensamentos enquanto estou em ação — não apenas depois.","Sei distinguir quando estou no meu estilo natural versus quando me adapto com esforço.","Após uma situação difícil, analiso o que aconteceu sem me culpar excessivamente."]},
  {id:"mud",name:"Predisposição à Mudança",color:"#2D7A5A",qs:["Quando recebo feedback que contradiz minha autoimagem, consigo escutar sem me fechar defensivamente.","Já mudei comportamentos importantes em resposta a evidências claras, mesmo quando era desconfortável.","Consigo identificar como meus próprios comportamentos às vezes sabotam o que digo querer.","Distingo entre ajustes superficiais de comportamento e transformações mais profundas de padrão.","Não desisto de mudar quando os resultados demoram a aparecer."]},
  {id:"sus",name:"Sustentação de Performance",color:"#C85A2D",qs:["Meu crescimento acontece em curvas sustentadas, não apenas em picos isolados seguidos de recaída.","Tenho rituais e práticas regulares que sustentam meu desenvolvimento, independente de motivação.","Mesmo em períodos de baixa motivação, mantenho consistência nos compromissos essenciais.","Consigo me recuperar e retomar o ritmo de desenvolvimento após períodos de dificuldade.","Invisto em prática deliberada e consciente, não apenas em exposição passiva a novos ambientes."]},
  {id:"aut",name:"Autenticidade Operacional",color:"#B87818",qs:["As pessoas ao meu redor me conhecem como realmente sou — não como acho que preciso ser.","Quando estou no meu melhor, não preciso pensar em como me comportar — simplesmente ajo com naturalidade.","Sinto que posso ser eu mesmo nos ambientes profissionais mais importantes da minha vida.","Raramente me sinto esgotado de tanto me adaptar ao que o ambiente parece exigir de mim.","Meus valores pessoais e minha forma de agir no trabalho estão bem alinhados."]},
  {id:"sal",name:"Potencial de Salto",color:"#2D5A8A",qs:["Já dei saltos significativos de performance quando coloquei intenção, estrutura e prática deliberada.","Consigo imaginar com clareza uma versão de mim operando em um nível substancialmente superior ao atual.","Tenho exemplos concretos de situações em que superei o que eu mesmo achava que conseguiria.","Quando enfrento desafios novos e grandes, minha primeira reação tende a ser curiosidade, não paralisia.","Acredito que meu potencial atual é significativamente maior do que aquilo que estou entregando."]}
];
const LABELS=["Quase nunca","Raramente","Às vezes","Frequentemente","Quase sempre"];

let screen="intro",name="",dim=0,q=0,ans={};

function score(id){const a=ans[id];if(!a||!a.length)return 0;return Math.round(a.reduce((s,v)=>s+v,0)/a.length*20);}
function lvl(s){if(s>=80)return{t:"Muito Alto",c:"ph"};if(s>=65)return{t:"Alto",c:"ph"};if(s>=50)return{t:"Médio",c:"pm"};return{t:"Em Desenvolvimento",c:"pl"};}

function idxText(total){
  if(total>=90)return{lv:"Evoluabilidade Excepcional",desc:"Base plenamente consolidada. O desenvolvimento agora é de ordem superior — ampliar o impacto e expandir o território de atuação."};
  if(total>=80)return{lv:"Evoluabilidade Muito Alta",desc:"Perfil maduro com alto potencial de expansão. Pequenas intervenções precisas produzem saltos desproporcionais."};
  if(total>=70)return{lv:"Evoluabilidade Alta",desc:"Sólida base de desenvolvimento com um ponto de alavanca específico. O processo chegou no momento certo."};
  if(total>=60)return{lv:"Evoluabilidade Ativa",desc:"Oportunidades claras de aceleração com intervenções precisas. O processo de desenvolvimento vai ter impacto rápido e visível."};
  if(total>=50)return{lv:"Evoluabilidade em Desenvolvimento",desc:"Bases presentes, consolidação necessária. Os primeiros 3 meses vão construir a estrutura que sustenta o próximo nível."};
  return{lv:"Evoluabilidade Emergente",desc:"Processo transformador de médio prazo. Alta necessidade de estrutura e acompanhamento próximo para resultados sustentados."};
}

function radarSVG(sz){
  const cx=sz/2,cy=sz/2+8,r=sz*.36,n=5;
  const pt=(f,i)=>{const a=-Math.PI/2+(i*2*Math.PI/n);return[cx+r*f*Math.cos(a),cy+r*f*Math.sin(a)];};
  const poly=(pts,fill,stroke,sw)=>`<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
  const grids=[.25,.5,.75,1].map(f=>poly(DIMS.map((_,i)=>pt(f,i)),"none","#E8E6E0","1")).join("");
  const axes=DIMS.map((_,i)=>{const p=pt(1,i);return`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#E8E6E0" stroke-width="1"/>`;}).join("");
  const dataPts=DIMS.map((d,i)=>pt(score(d.id)/100,i));
  const dots=DIMS.map((d,i)=>{const p=dataPts[i];return`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${d.color}" stroke="white" stroke-width="2"/>`;}).join("");
  const labels=DIMS.map((d,i)=>{const a=-Math.PI/2+(i*2*Math.PI/n);const lr=r+28;const x=cx+lr*Math.cos(a);const y=cy+lr*Math.sin(a);return`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#6B6B65" font-weight="700" font-family="DM Sans,sans-serif">${d.id==="mud"?"MUDANÇA":d.id==="sus"?"SUSTENT.":d.id==="aut"?"AUTENT.":d.id==="sal"?"SALTO":"META"}</text>`;}).join("");
  return`<svg width="${sz}" height="${sz+16}" viewBox="0 0 ${sz} ${sz+16}"><defs><filter id="gs"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity=".1"/></filter></defs>${grids}${axes}${poly(dataPts,"rgba(75,67,168,0.12)","#4B43A8","2")}${dots}${labels}</svg>`;
}

function saveData(){
  const s={};DIMS.forEach(d=>s[d.id]=score(d.id));
  const total=Math.round(Object.values(s).reduce((a,v)=>a+v,0)/5);
  try{localStorage.setItem("evoluabilidade",JSON.stringify({name,scores:s,total,date:new Date().toISOString()}));}catch(e){}
  return total;
}

function render(){
  const r=document.getElementById("root");
  const done=dim*5+q;
  const prog=Math.round(done/25*100);

  if(screen==="intro"){
    r.innerHTML=`<div class="card" style="text-align:center;padding:36px 24px">
      <div class="icon">⚡</div>
      <h1>Assessment de<br>Evoluabilidade</h1>
      <p class="sub">Metodologia Daniel Scharf · 5 dimensões · 25 perguntas · ~8 min</p>
      <p style="font-size:14px;color:#6B6B65;line-height:1.75;margin-bottom:24px">Mapeamento da sua capacidade de dar saltos de performance e sustentá-los ao longo do tempo.</p>
      <input class="name-inp" id="ni" placeholder="Seu nome (opcional)" value="${name}">
      <button class="btn-main" onclick="go()">Iniciar assessment</button>
    </div>`;
    return;
  }

  if(screen==="q"){
    const d=DIMS[dim];
    r.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:13px;color:var(--t3)">Dimensão ${dim+1} de 5</span>
        <span style="font-size:13px;color:var(--t3)">${done+1}/25</span></div>
      <div class="prog"><div class="prog-fill" style="width:${prog}%;background:${d.color}"></div></div>
      <div class="card">
        <div class="dim-badge" style="background:${d.color}22;color:${d.color}">${d.name}</div>
        <div class="q-cnt">Pergunta ${q+1} de 5</div>
        <div class="q-text">${d.qs[q]}</div>
        <div class="likert">${[1,2,3,4,5].map(n=>`<button class="lb" onclick="pick(${n})">
          <div class="ln" style="${n>=4?`background:${d.color}22;color:${d.color}`:""}">${n}</div>${LABELS[n-1]}</button>`).join("")}
        </div>
      </div>`;
    return;
  }

  const total=saveData();
  const {lv,desc}=idxText(total);
  r.innerHTML=`
    <div class="card idx-wrap">
      <p style="font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Índice de Evoluabilidade${name?" · "+name:""}</p>
      <div class="idx-num">${total}<span>/100</span></div>
      <div class="idx-lv">${lv}</div>
      <div class="idx-desc">${desc}</div>
    </div>
    <div class="card">
      <div class="radar-wrap">${radarSVG(240)}</div>
      ${DIMS.map(d=>{const s=score(d.id);const lv2=lvl(s);return`<div class="sc-row">
        <div class="sc-dot" style="background:${d.color}"></div>
        <div class="sc-name">${d.name}</div>
        <div class="sc-bar"><div class="sc-fill" style="width:${s}%;background:${d.color}"></div></div>
        <div class="sc-val" style="color:${d.color}">${s}</div>
        <span class="pill ${lv2.c}">${lv2.t}</span>
      </div>`;}).join("")}
    </div>
    <button class="btn-report" onclick="openReport()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Gerar Relatório Completo PDF
    </button>
    <button class="btn-sec" onclick="screen='intro';dim=0;q=0;ans={};render()">Fazer novamente</button>`;
}

function go(){name=document.getElementById("ni")?.value||"";screen="q";render();}
function pick(v){const id=DIMS[dim].id;ans[id]=[...(ans[id]||[]),v];if(q<4){q++;}else if(dim<4){dim++;q=0;}else{screen="result";}render();}
function openReport(){window.open("/relatorio","_blank");}
render();
</script>
</body>
</html>
